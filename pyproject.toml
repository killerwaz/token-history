[project]
name = "token-history"
version = "1.0.0"
description = "Persist, merge and chart AI coding token usage (Claude Code + Codex)"
readme = "README.md"
license = { text = "MIT" }
# The scripts stay 3.9-compatible so the no-uv `python3` fallback keeps working
# on a stock macOS; the interpreter uv actually provisions is pinned by
# .python-version (3.12).
requires-python = ">=3.9"
# Windows ships no IANA tz database, so zoneinfo needs tzdata there. Elsewhere the
# system copy is used and the scripts stay standard-library only.
dependencies = ["tzdata; sys_platform == 'win32'"]

[tool.uv]
# A scripts repo, not an installable package: `uv sync` should build the
# environment, never try to build/install the project itself.
package = false
